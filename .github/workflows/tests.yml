name: tests

# Review finding T1: nothing ran the suites automatically, and plain
# `pytest` collects nothing from the script-style files. One runner does
# both, each suite in its own process: python tools/run_all_tests.py

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # base-commit comparison tests need history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install flask waitress requests pillow pytest
      - name: Run every suite, one process each
        run: python tools/run_all_tests.py
      - name: Show the byte-for-byte guards ran
        shell: bash
        run: |
          python -m pytest -v tests/test_uia_tree.py::test_hands_off_is_byte_for_byte_the_base tests/test_uia_tree.py::test_gateway_off_is_byte_for_byte_the_base
          python -m pytest -v tests/test_agent_browser.py::test_off_is_byte_for_byte_the_base_gateway
          python -m pytest -v tests/test_dom_adapter.py::test_off_is_byte_for_byte_the_old_gateway

  windows:
    # The Windows job passed at the previous merge; failures now block CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # base-commit comparison tests need history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install flask waitress requests pillow pytest
      - name: Run every suite, one process each
        run: python tools/run_all_tests.py
      - name: Show the byte-for-byte guards ran
        shell: bash
        run: |
          python -m pytest -v tests/test_uia_tree.py::test_hands_off_is_byte_for_byte_the_base tests/test_uia_tree.py::test_gateway_off_is_byte_for_byte_the_base
          python -m pytest -v tests/test_agent_browser.py::test_off_is_byte_for_byte_the_base_gateway
          python -m pytest -v tests/test_dom_adapter.py::test_off_is_byte_for_byte_the_old_gateway
